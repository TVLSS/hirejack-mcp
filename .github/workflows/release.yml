name: Release

# Publishes @hirejack/mcp to npm (and updates the MCP Registry) when a version
# tag is pushed. Release flow going forward:
#   npm version patch   # or minor/major — bumps package.json + creates the tag
#   git push && git push --tags
# The tag (vX.Y.Z) must match package.json "version" or the job fails fast.
#
# One-time setup: add an npm **Automation** access token (bypasses 2FA, made for
# CI) as the repo secret NPM_TOKEN — Settings → Secrets and variables → Actions.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # for MCP Registry GitHub-OIDC auth (no stored secret needed)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@hirejack"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME"

      - run: npm ci

      - run: npm run build

      # Core release — fails the job if it fails.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort MCP Registry update via GitHub OIDC. Non-fatal: if it fails,
      # the npm publish above still stands and the registry can be updated
      # manually with `mcp-publisher login github-oidc && mcp-publisher publish`.
      - name: Update MCP Registry
        continue-on-error: true
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
